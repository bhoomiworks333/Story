<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Caveat;src:url(fonts/Caveat.woff2)}
@font-face{font-family:Nunito;src:url(fonts/Nunito.woff2);font-weight:200 1000}
@font-face{font-family:Kalam;src:url(fonts/Kalam.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
svg{display:block}
</style></head><body>
<svg id="svg" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs id="defs">
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
<feTurbulence id="turb" type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="1" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
</filter>
</defs>
<g id="root"></g>
<image href="paper_grain.png" width="1080" height="1920" style="mix-blend-mode:soft-light" opacity=".35"/>
</svg>
<script src="lib.js"></script><script src="characters.js"></script>
<script src="scene_shop.js"></script><script src="scene_nb.js"></script><script src="scene_desk.js"></script><script src="scene_factory.js"></script><script src="scene_brand.js"></script><script src="warp.js"></script><script src="main.js"></script>
</body></html>
